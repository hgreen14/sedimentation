<script>
// Tributary page interactions and table of contents generation
class TributaryInteractions {
  constructor() {
    this.init();
  }
  
  init() {
    this.generateTableOfContents();
    this.setupScrollSpy();
    this.setupSmoothScrolling();
    this.addInteractiveElements();
  }
  
  generateTableOfContents() {
    const tocContainer = document.getElementById('page-toc');
    if (!tocContainer) return;
    
    const headings = document.querySelectorAll('.tributary-content h2, .tributary-content h3');
    
    if (headings.length === 0) {
      tocContainer.innerHTML = '<p class="text-muted small">No headings found</p>';
      return;
    }
    
    const tocList = document.createElement('div');
    tocList.className = 'toc-list';
    
    headings.forEach((heading, index) => {
      // Add ID to heading if it doesn't have one
      if (!heading.id) {
        heading.id = `heading-${index}`;
      }
      
      const tocItem = document.createElement('a');
      tocItem.href = `#${heading.id}`;
      tocItem.textContent = heading.textContent;
      tocItem.className = `toc-item toc-${heading.tagName.toLowerCase()}`;
      
      // Indent h3 items
      if (heading.tagName.toLowerCase() === 'h3') {
        tocItem.style.paddingLeft = '2rem';
        tocItem.style.fontSize = '0.9rem';
      }
      
      tocList.appendChild(tocItem);
    });
    
    tocContainer.appendChild(tocList);
  }
  
  setupScrollSpy() {
    const tocLinks = document.querySelectorAll('#page-toc a');
    const headings = document.querySelectorAll('.tributary-content h2, .tributary-content h3');
    
    if (tocLinks.length === 0 || headings.length === 0) return;
    
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const id = entry.target.id;
        const tocLink = document.querySelector(`#page-toc a[href="#${id}"]`);
        
        if (entry.isIntersecting) {
          // Remove active class from all links
          tocLinks.forEach(link => link.classList.remove('active'));
          // Add active class to current link
          if (tocLink) {
            tocLink.classList.add('active');
          }
        }
      });
    }, {
      threshold: 0.5,
      rootMargin: '-20% 0px -20% 0px'
    });
    
    headings.forEach(heading => observer.observe(heading));
  }
  
  setupSmoothScrolling() {
    const tocLinks = document.querySelectorAll('#page-toc a[href^="#"]');
    
    tocLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        
        const targetId = link.getAttribute('href').substring(1);
        const targetElement = document.getElementById(targetId);
        
        if (targetElement) {
          const offsetTop = targetElement.offsetTop - 100;
          
          window.scrollTo({
            top: offsetTop,
            behavior: 'smooth'
          });
        }
      });
    });
  }
  
  addInteractiveElements() {
    // Add hover effects to related objects
    const objectCards = document.querySelectorAll('.related-objects .card');
    
    objectCards.forEach(card => {
      card.addEventListener('mouseenter', () => {
        card.style.transform = 'translateY(-5px)';
        card.style.transition = 'transform 0.3s ease';
      });
      
      card.addEventListener('mouseleave', () => {
        card.style.transform = 'translateY(0)';
      });
    });
    
    // Add reading progress indicator
    this.addReadingProgress();
    
    // Enhance images with lightbox capability
    this.enhanceImages();
  }
  
  addReadingProgress() {
    // Create progress bar
    const progressBar = document.createElement('div');
    progressBar.className = 'reading-progress';
    progressBar.innerHTML = '<div class="progress-fill"></div>';
    
    // Add styles
    const style = document.createElement('style');
    style.textContent = `
      .reading-progress {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: rgba(139, 69, 19, 0.1);
        z-index: 1000;
      }
      
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #8B4513, #D2691E);
        width: 0%;
        transition: width 0.3s ease;
      }
    `;
    
    document.head.appendChild(style);
    document.body.appendChild(progressBar);
    
    // Update progress on scroll
    const updateProgress = () => {
      const scrolled = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const progress = (scrolled / maxScroll) * 100;
      
      const progressFill = document.querySelector('.progress-fill');
      if (progressFill) {
        progressFill.style.width = `${Math.min(progress, 100)}%`;
      }
    };
    
    window.addEventListener('scroll', updateProgress);
    updateProgress(); // Initial call
  }
  
  enhanceImages() {
    const images = document.querySelectorAll('.tributary-content img');
    
    images.forEach(img => {
      // Wrap images in figure elements if not already wrapped
      if (img.parentElement.tagName.toLowerCase() !== 'figure') {
        const figure = document.createElement('figure');
        figure.className = 'figure text-center my-4';
        
        img.parentNode.insertBefore(figure, img);
        figure.appendChild(img);
        
        img.className = 'figure-img img-fluid rounded shadow';
        
        // Add caption if alt text exists
        if (img.alt) {
          const caption = document.createElement('figcaption');
          caption.className = 'figure-caption text-muted';
          caption.textContent = img.alt;
          figure.appendChild(caption);
        }
      }
      
      // Add click to zoom functionality
      img.style.cursor = 'pointer';
      img.addEventListener('click', () => {
        this.showImageModal(img);
      });
    });
  }
  
  showImageModal(img) {
    // Create modal backdrop
    const modal = document.createElement('div');
    modal.className = 'image-modal';
    modal.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    `;
    
    // Create enlarged image
    const enlargedImg = document.createElement('img');
    enlargedImg.src = img.src;
    enlargedImg.alt = img.alt;
    enlargedImg.style.cssText = `
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    `;
    
    modal.appendChild(enlargedImg);
    document.body.appendChild(modal);
    
    // Close modal on click
    modal.addEventListener('click', () => {
      document.body.removeChild(modal);
    });
    
    // Close modal on escape key
    const handleKeydown = (e) => {
      if (e.key === 'Escape') {
        document.body.removeChild(modal);
        document.removeEventListener('keydown', handleKeydown);
      }
    };
    
    document.addEventListener('keydown', handleKeydown);
  }
}

// Initialize tributary interactions when DOM is ready
document.addEventListener('DOMContentLoaded', () => {
  new TributaryInteractions();
  
  // Add entrance animations
  const contentElements = document.querySelectorAll('.tributary-content > *');
  
  contentElements.forEach((element, index) => {
    element.style.opacity = '0';
    element.style.transform = 'translateY(20px)';
    element.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
    element.style.transitionDelay = `${index * 0.1}s`;
    
    // Trigger animation
    setTimeout(() => {
      element.style.opacity = '1';
      element.style.transform = 'translateY(0)';
    }, 100);
  });
});
</script>
